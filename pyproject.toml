[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "context-bot"
version = "0.1.0"
description = "Telegram bot that extracts and summarizes text from PDF documents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [{ name = "Salavat Zaynulin" }]
dependencies = [
    "langdetect>=1.0.9,<2",
    "mtranslate>=1.8,<2",
    "pdfplumber>=0.11,<1",
    "pyTelegramBotAPI>=4.20,<5",
    "sentencepiece>=0.2,<1",
    "torch>=2.2",
    "transformers>=4.40,<5",
]

[project.scripts]
context-bot = "context_bot.app:main"

[tool.setuptools.packages.find]
where = ["src"]
